<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A1931">
<title>Contrôle d'entrée — Invitéo</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/scanner.css">
<link rel="stylesheet" href="/assets/ui.css">
</head>
<body>
<header class="bar"><span class="brand">Invitéo · Contrôle</span><button id="logout" class="link" type="button" hidden>Déconnexion</button></header>

<main>
  <section id="v-login" class="view" hidden>
    <h1>Connexion agent</h1>
    <form id="login-form" novalidate>
      <label>Adresse e-mail<input name="email" type="email" autocomplete="username" inputmode="email" required></label>
      <label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Se connecter</button>
      <p id="login-msg" class="msg" role="alert"></p>
    </form>
  </section>

  <section id="v-events" class="view" hidden>
    <h1>Choisir l'événement</h1>
    <ul id="event-list" class="events"></ul>
    <p id="events-msg" class="msg" role="status"></p>
  </section>

  <section id="v-scan" class="view" hidden>
    <div class="evt"><strong id="evt-name"></strong><button id="change-event" class="link" type="button">Changer</button></div>
    <div class="cam"><video id="video" playsinline muted></video><div class="frame" aria-hidden="true"></div></div>
    <p id="cam-msg" class="msg" role="status"></p>
    <form id="manual-form" novalidate>
      <label>Saisir le code ou le lien du billet<input id="manual" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <button class="btn btn-line" type="submit">Vérifier</button>
    </form>
    <p class="count" id="count" aria-live="polite"></p>
  </section>
</main>

<div id="result" class="result" hidden role="alertdialog" aria-live="assertive" aria-labelledby="r-title">
  <div class="r-inner">
    <p id="r-icon" class="r-icon" aria-hidden="true"></p>
    <h2 id="r-title"></h2>
    <p id="r-name" class="r-name"></p>
    <p id="r-detail" class="r-detail"></p>
    <button id="r-retry" class="btn btn-light" type="button" hidden>Réessayer</button>
    <button id="r-next" class="btn btn-light" type="button">Scanner suivant</button>
  </div>
</div>

<script src="/assets/scanner.js"></script>
</body>
</html>
